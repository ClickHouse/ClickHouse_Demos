version: policy-v2
metrics:
  active_customers: >-
    Count distinct customer_id values from v_orders with at least one order in the
    last 30 days whose status is neither cancelled nor returned.
  revenue: >-
    Sum quantity * unit_price - discount, excluding cancelled and returned orders.
  view_to_purchase_conversion: >-
    Percentage of sessions with a view event that also contain a purchase event.
  gross_margin: >-
    Sum quantity * (unit_price - unit_cost) over delivered orders.
