server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API to backend service in docker-compose network.
  # Resolve the backend hostname per-request via Docker's embedded DNS
  # (127.0.0.11) rather than caching its IP at startup: the backend container
  # gets a new IP whenever it is recreated (e.g. bringing up the module 05 otel
  # overlay, or any `up -d` after an env change), and a statically-resolved
  # upstream would then 502 until nginx itself was restarted. Using a variable
  # in proxy_pass forces re-resolution, so the frontend self-heals within the
  # resolver TTL. ipv6=off avoids the container's ::1/AAAA path.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: serve index.html for unknown routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}

