# LibreChat add-on for workshop module 06b (OPTIONAL).
# Self-contained + isolated: its own project name and a single host port (3090).
# Trimmed from LibreChat's deploy-compose.yml to mongodb + api + a one-shot init;
# search (Meilisearch) and RAG are disabled to keep the laptop footprint small.
#
#   docker compose --env-file .env -f docker-compose.librechat.yml up -d
name: nyc-taxi-librechat

services:
  mongodb:
    image: mongo:8.0.20
    container_name: nyc-taxi-librechat-mongodb
    restart: unless-stopped
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth

  # One-shot: create the default workshop user, then exit. Idempotent (|| true).
  librechat-init:
    image: ghcr.io/danny-avila/librechat@sha256:a46254938507971e0d4f7ed3f9d116bd9b118f4810b5b75eb716baf575645068  # pinned "latest" as of 2026-07-17 (no semver tag on :latest); repin deliberately
    container_name: nyc-taxi-librechat-init
    depends_on:
      - mongodb
    env_file:
      # All config lives in the workshop env file (see its "Module 06b" section);
      # there is no separate LibreChat .env.
      - ../.env.workshop
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 20); do
          npm run create-user -- "$${LIBRECHAT_DEFAULT_EMAIL:-workshop@example.com}" \
            "Workshop User" workshop "$${LIBRECHAT_DEFAULT_PASSWORD:-clickhouse}" \
            --email-verified=true && break
          echo "create-user attempt $$i failed (mongo not ready, or user already exists); retrying..."
          sleep 3
        done
        exit 0
    restart: "no"

  api:
    image: ghcr.io/danny-avila/librechat@sha256:a46254938507971e0d4f7ed3f9d116bd9b118f4810b5b75eb716baf575645068  # pinned "latest" as of 2026-07-17 (no semver tag on :latest); repin deliberately
    container_name: nyc-taxi-librechat-api
    depends_on:
      - mongodb
      - librechat-init
    restart: unless-stopped
    ports:
      - "${LIBRECHAT_PORT:-3090}:3080"
    env_file:
      # All config lives in the workshop env file (see its "Module 06b" section);
      # there is no separate LibreChat .env.
      - ../.env.workshop
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - SEARCH=false
      - RAG_API_URL=
      # We publish LibreChat on host ${LIBRECHAT_PORT} but it listens on 3080 inside
      # the container. Tell it its real public URL so OAuth / MCP callbacks (ClickStack,
      # Slack, ...) redirect back to the right port instead of the internal 3080.
      - DOMAIN_CLIENT=http://localhost:${LIBRECHAT_PORT:-3090}
      - DOMAIN_SERVER=http://localhost:${LIBRECHAT_PORT:-3090}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
