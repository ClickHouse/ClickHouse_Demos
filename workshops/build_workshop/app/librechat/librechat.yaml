# LibreChat config for workshop module 06b.
version: 1.3.13
cache: true

interface:
  agents:
    use: true
    create: true
  defaultPinnedTools:
    - 'mcp'

mcpServers:
  # ClickStack MCP — your ClickHouse Cloud otel_* telemetry. streamable-http + OAuth.
  # x-service-id pins the MCP to YOUR service (else it defaults to the first in the account).
  clickstack:
    type: streamable-http
    url: https://mcp.clickhouse.cloud/clickstack
    headers:
      x-service-id: "${CLICKSTACK_SERVICE_ID}"
    timeout: 120000
    serverInstructions: true

  # GitHub MCP — read the workshop app source (incl. the fault branch you check out).
  # GitHub's MCP has no dynamic client registration, so LibreChat auto-OAuth loops;
  # use a static read-only PAT and pin requiresOAuth:false.
  github:
    type: streamable-http
    url: https://api.githubcopilot.com/mcp/
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${GITHUB_PAT}"
      X-MCP-Readonly: "true"
      X-MCP-Toolsets: "repos"
    timeout: 120000
    serverInstructions: true
