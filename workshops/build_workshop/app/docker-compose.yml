services:
  broker:
    image: confluentinc/cp-kafka:8.0.0
    hostname: broker
    container_name: nyc-taxi-demo-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # Replace with a stable cluster id if you want; this is fine for local demos.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  clickhouse:
    image: clickhouse/clickhouse-server:24.9
    container_name: nyc-taxi-demo-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=nyc_tlc_data
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sample:/var/lib/clickhouse/user_files/sample
      - ./db/clickhouse-config/zz_cors.xml:/etc/clickhouse-server/config.d/zz_cors.xml:ro
      - ./nyc_taxi_data:/var/lib/clickhouse/user_files/nyc_taxi_data
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  backend:
    build:
      context: ./backend
    container_name: nyc-taxi-demo-backend
    depends_on:
      - clickhouse
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=nyc_tlc_data
      - API_CORS_ORIGINS=http://localhost:5173,http://localhost:8080
      - QUERY_TIMEOUT_SECONDS=5
      - MAX_ROWS_TO_READ=200000000
      - MAX_BYTES_TO_READ=5000000000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: nyc-taxi-demo-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: nyc-taxi-demo-ch-ui
    depends_on:
      - clickhouse
    environment:
      # CH-UI is a browser app; this URL must be reachable from the user's browser.
      - VITE_CLICKHOUSE_URL=http://localhost:8123
      - VITE_CLICKHOUSE_USER=default
      - VITE_CLICKHOUSE_PASS=
      - VITE_BASE_PATH=/
    ports:
      - "5521:5521"

  postgres:
    image: postgis/postgis:16-3.4
    container_name: nyc-taxi-demo-postgres
    hostname: postgres
    environment:
      - POSTGRES_DB=taxi
      - POSTGRES_USER=taxi
      - POSTGRES_PASSWORD=taxi
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./db/sample:/sample:ro
      - postgres_data:/var/lib/postgresql/data

  pg-cdc-init:
    image: postgis/postgis:16-3.4
    container_name: nyc-taxi-demo-pg-cdc-init
    depends_on:
      - postgres
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "until psql 'postgresql://taxi:taxi@postgres:5432/postgres' -c 'SELECT 1' >/dev/null 2>&1; do sleep 1; done;
       psql 'postgresql://taxi:taxi@postgres:5432/postgres' -tAc \"SELECT 1 FROM pg_database WHERE datname='taxi'\" | grep -q 1 || psql 'postgresql://taxi:taxi@postgres:5432/postgres' -c \"CREATE DATABASE taxi\";
       psql 'postgresql://taxi:taxi@postgres:5432/taxi' -c \"CREATE EXTENSION IF NOT EXISTS postgis;\";
       psql 'postgresql://taxi:taxi@postgres:5432/taxi' -c \"
         CREATE TABLE IF NOT EXISTS realtime_trips (
           id bigserial PRIMARY KEY,
           pickup_datetime timestamptz NOT NULL,
           dropoff_datetime timestamptz NOT NULL,
           pickup_location_id integer NOT NULL,
           dropoff_location_id integer NOT NULL,
           passenger_count smallint NOT NULL,
           trip_distance double precision NOT NULL,
           fare_amount double precision NOT NULL,
           tip_amount double precision NOT NULL,
           total_amount double precision NOT NULL,
           payment_type smallint NOT NULL,
           vendor_id smallint NOT NULL,
           car_type text NOT NULL DEFAULT 'yellow',
           created_at timestamptz NOT NULL DEFAULT now()
         );
         ALTER ROLE taxi WITH REPLICATION;
       \";
       psql 'postgresql://taxi:taxi@postgres:5432/taxi' -tAc \"SELECT 1 FROM pg_publication WHERE pubname='dbz_publication'\" | grep -q 1 || psql 'postgresql://taxi:taxi@postgres:5432/taxi' -c \"CREATE PUBLICATION dbz_publication FOR TABLE realtime_trips\";
       echo 'Postgres CDC DB/table/publication ensured.'"
    restart: "no"

  clickhouse-cdc-init:
    image: clickhouse/clickhouse-server:24.9
    container_name: nyc-taxi-demo-clickhouse-cdc-init
    depends_on:
      - clickhouse
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "until clickhouse-client --host clickhouse --port 9000 --query 'SELECT 1' >/dev/null 2>&1; do sleep 1; done;
       # Wait for the base nyc_tlc_data schema from ./db/init/001_schema.sql
       until [ \"$(clickhouse-client --host clickhouse --port 9000 --query \"EXISTS TABLE nyc_tlc_data.taxi_trips\")\" = \"1\" ]; do sleep 1; done;
       clickhouse-client --host clickhouse --port 9000 --query \"
       CREATE DATABASE IF NOT EXISTS nyc_tlc_data;

       -- Raw CDC landing table (Debezium JSON -> ClickHouse sink)
       DROP TABLE IF EXISTS nyc_tlc_data.realtime_trips_cdc;
       CREATE TABLE nyc_tlc_data.realtime_trips_cdc
       (
         id UInt64,
         pickup_datetime String,
         dropoff_datetime String,
         pickup_location_id UInt32,
         dropoff_location_id UInt32,
         passenger_count UInt32,
         trip_distance Float64,
         fare_amount Float64,
         tip_amount Float64,
         total_amount Float64,
         payment_type UInt32,
         vendor_id UInt32,
         car_type LowCardinality(String),
         created_at String,
         -- When the CDC record landed in ClickHouse. Used for TTL cleanup of this staging table.
         ingested_at DateTime('UTC') DEFAULT now('UTC')
       )
       ENGINE = MergeTree
       ORDER BY (ingested_at, id)
       TTL ingested_at + INTERVAL 1 DAY DELETE;

       -- Materialize CDC rows into the same table the dashboards already query: nyc_tlc_data.taxi_trips
       DROP TABLE IF EXISTS nyc_tlc_data.realtime_trips_to_taxi_trips_mv;
       CREATE MATERIALIZED VIEW nyc_tlc_data.realtime_trips_to_taxi_trips_mv
       TO nyc_tlc_data.taxi_trips
       AS
       SELECT
         car_type,
         CAST(vendor_id AS UInt16) AS vendor_id,
         coalesce(parseDateTimeBestEffortOrNull(pickup_datetime), now('UTC')) AS pickup_datetime,
         coalesce(parseDateTimeBestEffortOrNull(dropoff_datetime), now('UTC')) AS dropoff_datetime,
         CAST(pickup_location_id AS UInt16) AS pickup_location_id,
         CAST(dropoff_location_id AS UInt16) AS dropoff_location_id,
         CAST(passenger_count AS UInt16) AS passenger_count,
         trip_distance AS trip_distance,
         CAST(payment_type AS UInt16) AS payment_type,
         fare_amount AS fare_amount,
         tip_amount AS tip_amount,
         total_amount AS total_amount,
         'realtime_cdc' AS filename
       FROM nyc_tlc_data.realtime_trips_cdc;
       \";
       echo 'ClickHouse CDC landing table + MV->taxi_trips ensured.'"
    restart: "no"

  connect:
    build:
      context: ./kafka-connect
    container_name: nyc-taxi-demo-connect
    hostname: connect
    depends_on:
      - broker
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: "connect"
      CONNECT_GROUP_ID: "compose-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "docker-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "docker-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "docker-connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000

      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

  connect-init:
    image: curlimages/curl:8.10.1
    container_name: nyc-taxi-demo-connect-init
    depends_on:
      - connect
      - postgres
      - pg-cdc-init
      - clickhouse
      - clickhouse-cdc-init
    volumes:
      - ./kafka-connect/register-connectors.sh:/work/register-connectors.sh:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: "sh /work/register-connectors.sh"
    restart: "no"

  pg-trip-writer:
    build:
      context: ./loadgen
    container_name: nyc-taxi-demo-pg-trip-writer
    depends_on:
      - postgres
      - pg-cdc-init
      - connect-init
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=taxi
      - PGUSER=taxi
      - PGPASSWORD=taxi
      - RATE_PER_SEC=10
      - BATCH_SIZE=25
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.11.0
    container_name: nyc-taxi-demo-pgadmin
    depends_on:
      - postgres
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nyc-taxi-demo-kafka-ui
    depends_on:
      - broker
    ports:
      # Frontend already uses 8080; expose Kafka UI on a different host port.
      - "8089:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=nyc-taxi-demo
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:29092

volumes:
  clickhouse_data:
  postgres_data:
  pgadmin_data:

