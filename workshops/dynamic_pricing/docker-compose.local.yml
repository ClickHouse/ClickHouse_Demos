# Developer/test databases only. The learner workshop uses cloud databases.
services:
  postgres:
    image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
    environment:
      POSTGRES_USER: pricing_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10"]
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_PASSWORD: test-only-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1::8123"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "test-only-password", "--query", "SELECT 1"]
      interval: 1s
      timeout: 3s
      retries: 30
