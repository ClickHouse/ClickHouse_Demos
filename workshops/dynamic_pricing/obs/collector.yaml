# Merge with the ClickStack image's built-in OTLP receivers and ClickHouse exporters.
# The image entrypoint creates its telemetry schema in the configured database.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 10000
