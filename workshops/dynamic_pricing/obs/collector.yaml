receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 512
exporters:
  otlphttp/clickstack:
    endpoint: ${env:PRICING_CLICKSTACK_ENDPOINT}
    headers:
      authorization: ${env:PRICING_CLICKSTACK_API_KEY}
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 30s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/clickstack]
