# Trigger-only: when the BUILD workshop playbook changes on build-workshop-v1,
# tell the PRIVATE ClickHouse/DemoHouse repo to build + deploy the workshop.
#
# This repo (ClickHouse_Demos) is PUBLIC and holds NO cloud credentials. The
# only secret here is DEMOHOUSE_DISPATCH_TOKEN, a scoped token that can send a
# repository_dispatch to DemoHouse -- nothing else. All build/push/deploy and
# AWS access live in the private DemoHouse repo (see its deploy-workshop.yml),
# whose OIDC trust is locked to that repo.
name: Notify DemoHouse (workshop updated)

on:
  push:
    branches: [build-workshop-v1]
    paths:
      - "workshops/build_workshop/playbook/**"
  workflow_dispatch: {} # allow a manual re-trigger of the dev deploy

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch workshop deploy in DemoHouse (dev)
        env:
          TOKEN: ${{ secrets.DEMOHOUSE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "DEMOHOUSE_DISPATCH_TOKEN is not set - skipping dispatch."
            echo "Configure the secret to enable auto-deploy to dev.demohouse.cloud/workshop."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ClickHouse/DemoHouse/dispatches \
            -d "{\"event_type\":\"workshop-updated\",\"client_payload\":{\"ref\":\"build-workshop-v1\",\"sha\":\"${SHA}\"}}"
          echo "Dispatched workshop-updated -> ClickHouse/DemoHouse (sha ${SHA})."
