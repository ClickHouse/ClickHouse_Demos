name: Workshop

# DISABLED. Workshop hosting moved to labs.demohouse.cloud, which the WorkshopHouse
# repository builds and deploys from its own ci.yml and release.yml. That pipeline runs
# the same gates this one did -- check-docs.sh, check-windows.ps1, and the build_workshop
# backend and loadgen tests -- against its own copy of workshops/, so nothing here needs
# to fire on a push or a pull request any more.
#
# The two hosts this workflow deployed to are gone: workshop.demohouse.cloud and
# dev-workshop.demohouse.cloud now return 404. The deploy job below is therefore pinned
# off as well, so that a manual run cannot push an image at a dead target. Re-enabling
# means restoring the triggers *and* repointing the deploy job at whatever should serve
# the site -- do not simply flip the `if` back on.
#
# Kept rather than deleted so the pipeline's history stays readable next to the
# replacement. The previous triggers were:
#
#   on:
#     pull_request:
#       branches: [dev, main, dev-build-workshop-v1, build-workshop-v1]
#     push:
#       branches: [dev-build-workshop-v1, build-workshop-v1]
#       paths:
#         - "workshops/build_workshop/**"
#         - ".github/workflows/workshop.yml"
#     workflow_dispatch: {}

on:
  # Manual only. The verify job is still useful for spot-checking this repo's copy of
  # workshops/ by hand; nothing runs automatically.
  workflow_dispatch: {}

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Workshop CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/build_workshop
    steps:
      - uses: actions/checkout@v4

      - name: Validate workshop documentation policy
        run: ./scripts/check-docs.sh

      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workshops/build_workshop/app/backend/requirements.txt
            workshops/build_workshop/app/backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: workshops/build_workshop/app/backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_chat_guardrails.py tests/test_db_retry.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: workshops/build_workshop/playbook/package-lock.json

      - name: Install playbook dependencies
        working-directory: workshops/build_workshop/playbook
        run: npm ci

      - name: Check playbook types
        working-directory: workshops/build_workshop/playbook
        run: npm run types:check

      - name: Build root-path playbook
        working-directory: workshops/build_workshop/playbook
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://workshop.demohouse.cloud
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --webpack

  deploy:
    name: Deploy workshop
    # Pinned off. Both targets return 404 -- the site is served from
    # labs.demohouse.cloud by the WorkshopHouse pipeline now. Left in place as the record
    # of how the old host was built and released; see the note at the top of this file
    # before re-enabling. The original condition was:
    #
    #   if: >-
    #     (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
    #     (github.ref_name == 'dev-build-workshop-v1' ||
    #      github.ref_name == 'build-workshop-v1')
    if: false
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Select deployment target
        id: target
        env:
          DEV_INSTANCE_ID: ${{ vars.WORKSHOP_DEV_INSTANCE_ID }}
          PROD_INSTANCE_ID: ${{ vars.WORKSHOP_PROD_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "build-workshop-v1" ]]; then
            echo "instance_id=${PROD_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=prod" >> "${GITHUB_OUTPUT}"
            echo "url=https://workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
          else
            echo "instance_id=${DEV_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=dev" >> "${GITHUB_OUTPUT}"
            echo "url=https://dev-workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
          fi
          test -n "$(sed -n 's/^instance_id=//p' "${GITHUB_OUTPUT}")"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WORKSHOP_AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Build and push immutable image
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          REPOSITORY: posthouse-demo-workshop
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
          SITE_URL: ${{ steps.target.outputs.url }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg NEXT_PUBLIC_BASE_PATH= \
            --build-arg NEXT_PUBLIC_SITE_URL="${SITE_URL}" \
            --tag "${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${REPOSITORY}:${IMAGE_ALIAS}" \
            --push \
            workshops/build_workshop/playbook

      - name: Read image digest
        id: image
        env:
          REPOSITORY: posthouse-demo-workshop
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "${digest}" != "None"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy exact revision with SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
        run: |
          set -euo pipefail
          parameters=$(jq -n \
            --arg registry "${REGISTRY}" \
            --arg tag "${GITHUB_SHA}" \
            --arg digest "${EXPECTED_DIGEST}" \
            --arg alias "${IMAGE_ALIAS}" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/demohouse",
              ("aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin " + $registry),
              ("ECR_REGISTRY=" + $registry + " ./scripts/deploy-workshop.sh " + $tag + " " + $digest + " " + $alias)
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Workshop ${GITHUB_REF_NAME} ${GITHUB_SHA}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          terminal_status=""
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)
            case "${status}" in
              Success)
                terminal_status=${status}
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                terminal_status=${status}
                break
                ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "${terminal_status}" = "Success"

      - name: Verify public routes
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /docs/learner/00-setup /docs/learner/07-break-and-fix /docs/learner/08-chat-langfuse; do
            curl --fail --show-error --silent --retry 12 --retry-delay 5 \
              --output /dev/null "${SITE_URL}${path}"
          done

      - name: Deployment summary
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          DIGEST: ${{ steps.image.outputs.digest }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          {
            echo "### Workshop deployment"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${DIGEST}\`"
            echo "- SSM command: \`${COMMAND_ID}\`"
            echo "- URL: ${SITE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
