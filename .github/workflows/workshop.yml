name: Workshop

# dev-build-workshop-v1 deploys dev; build-workshop-v1 deploys production.

on:
  pull_request:
    # Keep the required workshop check available on the existing protected repo
    # branches, but only the dedicated workshop branches deploy on push.
    branches: [dev, main, dev-build-workshop-v1, build-workshop-v1]
  push:
    branches: [dev-build-workshop-v1, build-workshop-v1]
    paths:
      - "workshops/build_workshop/**"
      - ".github/workflows/workshop.yml"
  workflow_dispatch: {}

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Workshop CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/build_workshop
    steps:
      - uses: actions/checkout@v4

      - name: Validate workshop documentation policy
        run: ./scripts/check-docs.sh

      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workshops/build_workshop/app/backend/requirements.txt
            workshops/build_workshop/app/backend/requirements-dev.txt
            workshops/build_workshop/polymarket/collector/requirements.txt
            workshops/build_workshop/polymarket/collector/requirements-dev.txt

      - name: Run backend tests
        working-directory: workshops/build_workshop/app/backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_chat_guardrails.py tests/test_db_retry.py tests/test_cloud_defaults.py ../loadgen/test_config.py -q

      - name: Run Polymarket collector tests
        working-directory: workshops/build_workshop/polymarket/collector
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Run Polymarket ClickHouse integration
        working-directory: workshops/build_workshop
        run: ./polymarket/test-clickhouse.sh

      - name: Run RTA dashboard tests
        working-directory: workshops/RTA-mini-workshop/dashboard
        run: python -m pytest test_app.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: workshops/build_workshop/playbook/package-lock.json

      - name: Install playbook dependencies
        working-directory: workshops/build_workshop/playbook
        run: npm ci

      - name: Check playbook types
        working-directory: workshops/build_workshop/playbook
        run: npm run types:check

      - name: Build root-path playbook
        working-directory: workshops/build_workshop/playbook
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://workshop.demohouse.cloud
          NEXT_PUBLIC_WORKSHOP_ENV: dev
          NEXT_PUBLIC_WORKSHOP_BRANCH: dev-build-workshop-v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --webpack

  windows:
    name: Windows compatibility
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workshops/build_workshop
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows and WSL documentation contract
        shell: pwsh
        run: ./scripts/check-windows.ps1

      - name: Validate Bash scripts after Windows checkout
        shell: bash
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 -n1 bash -n

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workshops/build_workshop/app/backend/requirements.txt
            workshops/build_workshop/app/backend/requirements-dev.txt
            workshops/build_workshop/polymarket/collector/requirements.txt
            workshops/build_workshop/polymarket/collector/requirements-dev.txt

      - name: Run backend tests on Windows
        working-directory: workshops/build_workshop/app/backend
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_chat_guardrails.py tests/test_db_retry.py tests/test_cloud_defaults.py ../loadgen/test_config.py -q

      - name: Run Polymarket collector tests on Windows
        working-directory: workshops/build_workshop/polymarket/collector
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Run RTA dashboard tests on Windows
        working-directory: workshops/RTA-mini-workshop/dashboard
        shell: pwsh
        run: python -m pytest test_app.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: workshops/build_workshop/playbook/package-lock.json

      - name: Install playbook dependencies on Windows
        working-directory: workshops/build_workshop/playbook
        run: npm ci

      - name: Check playbook types on Windows
        working-directory: workshops/build_workshop/playbook
        run: npm run types:check

      - name: Build root-path playbook on Windows
        working-directory: workshops/build_workshop/playbook
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://workshop.demohouse.cloud
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --webpack

  deploy:
    name: Deploy workshop
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'dev-build-workshop-v1' ||
       github.ref_name == 'build-workshop-v1')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Select deployment target
        id: target
        env:
          DEV_INSTANCE_ID: ${{ vars.WORKSHOP_DEV_INSTANCE_ID }}
          PROD_INSTANCE_ID: ${{ vars.WORKSHOP_PROD_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "build-workshop-v1" ]]; then
            echo "instance_id=${PROD_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=prod" >> "${GITHUB_OUTPUT}"
            echo "url=https://workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
            echo "workshop_env=prod" >> "${GITHUB_OUTPUT}"
          else
            echo "instance_id=${DEV_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=dev" >> "${GITHUB_OUTPUT}"
            echo "url=https://dev-workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
            echo "workshop_env=dev" >> "${GITHUB_OUTPUT}"
          fi
          test -n "$(sed -n 's/^instance_id=//p' "${GITHUB_OUTPUT}")"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WORKSHOP_AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Build and push immutable image
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          REPOSITORY: posthouse-demo-workshop
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
          SITE_URL: ${{ steps.target.outputs.url }}
          WORKSHOP_ENV: ${{ steps.target.outputs.workshop_env }}
          WORKSHOP_BRANCH: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg NEXT_PUBLIC_BASE_PATH= \
            --build-arg NEXT_PUBLIC_SITE_URL="${SITE_URL}" \
            --build-arg NEXT_PUBLIC_WORKSHOP_ENV="${WORKSHOP_ENV}" \
            --build-arg NEXT_PUBLIC_WORKSHOP_BRANCH="${WORKSHOP_BRANCH}" \
            --tag "${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${REPOSITORY}:${IMAGE_ALIAS}" \
            --push \
            workshops/build_workshop/playbook

      - name: Read image digest
        id: image
        env:
          REPOSITORY: posthouse-demo-workshop
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "${digest}" != "None"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy exact revision with SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
        run: |
          set -euo pipefail
          parameters=$(jq -n \
            --arg registry "${REGISTRY}" \
            --arg tag "${GITHUB_SHA}" \
            --arg digest "${EXPECTED_DIGEST}" \
            --arg alias "${IMAGE_ALIAS}" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/demohouse",
              ("aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin " + $registry),
              ("ECR_REGISTRY=" + $registry + " ./scripts/deploy-workshop.sh " + $tag + " " + $digest + " " + $alias)
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Workshop ${GITHUB_REF_NAME} ${GITHUB_SHA}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          terminal_status=""
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)
            case "${status}" in
              Success)
                terminal_status=${status}
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                terminal_status=${status}
                break
                ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "${terminal_status}" = "Success"

      - name: Verify public routes
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          WORKSHOP_ENV: ${{ steps.target.outputs.workshop_env }}
        run: |
          set -euo pipefail

          probe_route() {
            local path=$1
            local attempt result status redirect

            for attempt in $(seq 1 12); do
              result=$(curl --show-error --silent \
                --connect-timeout 10 \
                --max-time 30 \
                --output /dev/null \
                --write-out $'%{http_code}\t%{redirect_url}' \
                "${SITE_URL}${path}" || true)
              status=${result%%$'\t'*}
              redirect=${result#*$'\t'}

              if [[ "${status}" == "200" && -z "${redirect}" ]]; then
                echo "${path}: HTTP 200"
                return 0
              fi

              echo "${path}: attempt ${attempt}/12 returned HTTP ${status:-000} redirect=${redirect:-none}"
              sleep 5
            done

            if [[ "${redirect:-}" == */login* ]]; then
              echo "::error::${SITE_URL}${path} is routed to the authenticated DemoHouse login page."
            else
              echo "::error::${SITE_URL}${path} did not return a direct HTTP 200 response."
            fi
            return 1
          }

          routes=(/ /build-workshop /rta-mini/index.html /docs/ai-sre /docs/polymarket /docs/polymarket/learner/00-setup /docs/polymarket/instructor /docs/learner/00-setup /docs/learner/07-break-and-fix /docs/learner/08-chat-langfuse)
          if [[ "${WORKSHOP_ENV}" == "dev" ]]; then
            routes+=(/docs/polymarket/rehearsal)
          fi
          for path in "${routes[@]}"; do
            probe_route "${path}"
          done

          if [[ "${WORKSHOP_ENV}" == "prod" ]]; then
            rehearsal_status=$(curl --show-error --silent \
              --output /dev/null --write-out '%{http_code}' \
              "${SITE_URL}/docs/polymarket/rehearsal")
            test "${rehearsal_status}" = "404"
          fi

      - name: Deployment summary
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          DIGEST: ${{ steps.image.outputs.digest }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          {
            echo "### Workshop deployment"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${DIGEST}\`"
            echo "- SSM command: \`${COMMAND_ID}\`"
            echo "- URL: ${SITE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
