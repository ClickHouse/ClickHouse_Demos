name: Workshop

# dev-build-workshop-v1 deploys dev; build-workshop-v1 deploys production.

on:
  pull_request:
    # Keep the required workshop check available on the existing protected repo
    # branches, but only the dedicated workshop branches deploy on push.
    branches: [dev, main, dev-build-workshop-v1, build-workshop-v1]
  push:
    branches: [dev-build-workshop-v1, build-workshop-v1]
    paths:
      - "workshops/build_workshop/**"
      - ".github/workflows/workshop.yml"
  workflow_dispatch: {}

concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Workshop CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/build_workshop
    steps:
      - uses: actions/checkout@v4

      - name: Validate workshop documentation policy
        run: ./scripts/check-docs.sh

      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workshops/build_workshop/app/backend/requirements.txt
            workshops/build_workshop/app/backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: workshops/build_workshop/app/backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_chat_guardrails.py tests/test_db_retry.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: workshops/build_workshop/playbook/package-lock.json

      - name: Install playbook dependencies
        working-directory: workshops/build_workshop/playbook
        run: npm ci

      - name: Check playbook types
        working-directory: workshops/build_workshop/playbook
        run: npm run types:check

      - name: Build root-path playbook
        working-directory: workshops/build_workshop/playbook
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://workshop.demohouse.cloud
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --webpack

  deploy:
    name: Deploy workshop
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'dev-build-workshop-v1' ||
       github.ref_name == 'build-workshop-v1')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Select deployment target
        id: target
        env:
          DEV_INSTANCE_ID: ${{ vars.WORKSHOP_DEV_INSTANCE_ID }}
          PROD_INSTANCE_ID: ${{ vars.WORKSHOP_PROD_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "build-workshop-v1" ]]; then
            echo "instance_id=${PROD_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=prod" >> "${GITHUB_OUTPUT}"
            echo "url=https://workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
          else
            echo "instance_id=${DEV_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            echo "image_alias=dev" >> "${GITHUB_OUTPUT}"
            echo "url=https://dev-workshop.demohouse.cloud" >> "${GITHUB_OUTPUT}"
          fi
          test -n "$(sed -n 's/^instance_id=//p' "${GITHUB_OUTPUT}")"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WORKSHOP_AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Build and push immutable image
        env:
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          REPOSITORY: posthouse-demo-workshop
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
          SITE_URL: ${{ steps.target.outputs.url }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg NEXT_PUBLIC_BASE_PATH= \
            --build-arg NEXT_PUBLIC_SITE_URL="${SITE_URL}" \
            --tag "${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${REPOSITORY}:${IMAGE_ALIAS}" \
            --push \
            workshops/build_workshop/playbook

      - name: Read image digest
        id: image
        env:
          REPOSITORY: posthouse-demo-workshop
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "${digest}" != "None"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy exact revision with SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REGISTRY: 959934561610.dkr.ecr.ap-southeast-1.amazonaws.com
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ALIAS: ${{ steps.target.outputs.image_alias }}
        run: |
          set -euo pipefail
          parameters=$(jq -n \
            --arg registry "${REGISTRY}" \
            --arg tag "${GITHUB_SHA}" \
            --arg digest "${EXPECTED_DIGEST}" \
            --arg alias "${IMAGE_ALIAS}" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/demohouse",
              ("aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin " + $registry),
              ("ECR_REGISTRY=" + $registry + " ./scripts/deploy-workshop.sh " + $tag + " " + $digest + " " + $alias)
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Workshop ${GITHUB_REF_NAME} ${GITHUB_SHA}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          terminal_status=""
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)
            case "${status}" in
              Success)
                terminal_status=${status}
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                terminal_status=${status}
                break
                ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "${terminal_status}" = "Success"

      # Edge verification. This step proves the ROUTING, not the container.
      # Container liveness is already proven upstream and independently: the
      # compose healthcheck fetches http://127.0.0.1:3000/ from inside the
      # workshop container (bypassing nginx and any gate), deploy-workshop.sh
      # blocks on it in wait_healthy, and the SSM step above fails this job
      # unless that command reports Success. There is no ungated health route
      # to probe from here either, the playbook app exposes only /, /docs/*,
      # /llms*.txt, /api/search and /og/*, so /health returns a Fumadocs 404.
      #
      # So the only question left for a public probe is whether the workshop
      # host is still routed to the workshop origin behind its JWT gate.
      # "curl --fail" could not answer that: --fail only trips on >= 400, so a
      # host answering nothing but redirects on every content path kept this
      # step green. That is the exact signature of the nginx drift problem, the
      # workshop server_name block lives only as hand-injected drift on the
      # instance and any posthouse deploy restores a workshop-less nginx.conf,
      # after which this host falls through to "server_name _" -> web:3000 and
      # the posthouse Next middleware answers every path with a login redirect.
      #
      # Statuses are matched exactly, never as a range:
      #   302 the nginx access_by_lua_block refused an unauthenticated probe.
      #       GitHub Actions holds no dh_session cookie, so for a gated host
      #       302 is the only correct answer and 200 means the gate is not live.
      #   307 the apex fall-through. NextResponse.redirect emits 307 while the
      #       lua gate emits 302, and that is what lets the two be told apart.
      # Set the WORKSHOP_EXPECTED_STATUS repo variable to 200 for the ungated
      # parity deploy that lands the nginx block before the gate goes on.
      # No --location on purpose, following the redirect would hide all of this.
      - name: Verify public routes
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          EXPECTED_STATUS: ${{ vars.WORKSHOP_EXPECTED_STATUS || '302' }}
        run: |
          set -euo pipefail
          workshop_host=${SITE_URL#https://}
          for path in / /docs/learner/00-setup /docs/learner/07-break-and-fix /docs/learner/08-chat-langfuse; do
            url="${SITE_URL}${path}"
            code=""
            target=""
            # Retry in the shell, not with curl --retry. Asserting the status
            # code means curl must exit 0 on a 502 so we can read it, which
            # also stops curl retrying it, and a container still warming up is
            # exactly the 502 case worth retrying. Same 12 attempts, 5s apart.
            for _ in $(seq 1 12); do
              response=$(curl --show-error --silent \
                --connect-timeout 10 --max-time 30 \
                --output /dev/null \
                --write-out '%{http_code} %{redirect_url}' \
                "${url}") || response="000 "
              code=${response%% *}
              target=${response#* }
              if [[ "${code}" == "${EXPECTED_STATUS}" ]]; then
                break
              fi
              sleep 5
            done
            if [[ "${code}" != "${EXPECTED_STATUS}" ]]; then
              echo "ERROR: ${url} answered ${code}, expected ${EXPECTED_STATUS}" >&2
              case "${code}" in
                000)
                  echo "ERROR: no HTTP response at all, DNS, TLS, ALB or nginx is down" >&2
                  ;;
                200)
                  echo "ERROR: an unauthenticated probe got content, the JWT gate is not enforcing on this host" >&2
                  ;;
                307)
                  echo "ERROR: redirect target was ${target:-<none>}" >&2
                  echo "ERROR: 307 is the posthouse apex fall-through, the workshop server_name block is missing from the live nginx.conf and this host is being served by web:3000" >&2
                  ;;
                30*)
                  echo "ERROR: redirect target was ${target:-<none>}" >&2
                  ;;
              esac
              exit 1
            fi
            if [[ "${EXPECTED_STATUS}" == 30* ]]; then
              case "${target}" in
                *"://${workshop_host}/login"*)
                  # The lua gate on a workshop subdomain has to send users to
                  # the apex because the playbook ships no /login of its own.
                  # A /login on the workshop host itself means the posthouse web
                  # app answered for this host instead of the workshop origin.
                  echo "ERROR: ${url} redirected to /login on ${workshop_host} itself, this host is being served by the posthouse app, not the workshop" >&2
                  exit 1
                  ;;
                */login|*/login"?"*|*/not-authorized|*/not-authorized"?"*) ;;
                *)
                  echo "ERROR: ${url} redirected to an unexpected target: ${target:-<none>}" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "ok ${url} -> ${code} ${target}"
          done

      - name: Deployment summary
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          DIGEST: ${{ steps.image.outputs.digest }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          {
            echo "### Workshop deployment"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${DIGEST}\`"
            echo "- SSM command: \`${COMMAND_ID}\`"
            echo "- URL: ${SITE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
