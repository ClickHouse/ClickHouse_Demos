name: Dynamic pricing kit

on:
  pull_request:
    branches: [main]
    paths:
      - "workshops/dynamic_pricing/**"
      - ".github/workflows/dynamic-pricing.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workshops/dynamic_pricing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workshops/dynamic_pricing/versions.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workshops/dynamic_pricing/app/frontend/package-lock.json
      - name: Install isolated lab dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r versions.lock -e app/backend
          cd app/frontend
          npm ci --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify local SQL, application, telemetry, and browser flows
        run: bash scripts/check-kit.sh
