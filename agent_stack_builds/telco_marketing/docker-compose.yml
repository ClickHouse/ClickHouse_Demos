# Base compose file -- used by both local and hybrid deployment modes.
# Local mode adds MCP + ClickHouse + Langfuse via docker-compose.local.yml overlay.
# Hybrid mode uses ClickHouse Cloud's remote MCP server (no local MCP container).
# Local mode: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Hybrid mode: docker compose -f docker-compose.yml up -d

services:
  # LibreChat - AI Chat Frontend
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: telco-librechat
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    depends_on:
      mongodb:
        condition: service_started
      meilisearch:
        condition: service_started
    env_file:
      - .env
    volumes:
      # Bind-mount strings are quoted so they survive YAML parsing on Windows
      # hosts where the resolved path may contain spaces (e.g. C:\Users\My Name\...).
      - "./.env:/app/.env"
      - "./librechat.${DEPLOY_MODE}.yaml:/app/librechat.yaml"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - telco-network

  # MongoDB - LibreChat conversation store.
  # Pinned to 8.0.17: 8.0.23 refuses to start on Linux kernel 6.19+
  # (Docker Desktop's VM kernel) -- see MongoDB SERVER-121912.
  mongodb:
    image: mongo:8.0.17
    container_name: telco-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - telco-network

  # Meilisearch - LibreChat search
  meilisearch:
    image: getmeili/meilisearch:v1.44.0
    container_name: telco-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterkey}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - telco-network

  # Data Generator - populates ClickHouse with telco data
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: telco-data-generator
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      NUM_CUSTOMERS: ${NUM_CUSTOMERS:-10000}
      NUM_DAYS: ${NUM_DAYS:-30}
      NUM_CAMPAIGNS: ${NUM_CAMPAIGNS:-100}
      EVENTS_PER_DAY: ${EVENTS_PER_DAY:-10000}
      DATA_SIZE: ${DATA_SIZE:-}
      DATA_SEED: ${DATA_SEED:-42}
      GENERATE_DATASETS: ${GENERATE_DATASETS:-all}
      PYTHONUNBUFFERED: 1
    networks:
      - telco-network
    profiles:
      - generator

volumes:
  mongodb_data:
    driver: local
  meilisearch_data:
    driver: local

networks:
  telco-network:
    driver: bridge
